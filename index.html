  pbEl('circle',{r:8,fill:'url(#pbPtrG)'},PB.ptr);
  PB.knob=pbEl('circle',{r:4,fill:'#ff8b5e',stroke:'#40362e','stroke-width':1.4},PB.ptr);
  const txt={'font-size':'9','font-family':'system-ui',fill:'rgba(64,54,46,.5)'};
  PB.val=pbEl('text',{'font-size':'9.5','font-family':'system-ui',fill:'#40362e','text-anchor':'middle',y:20});
  PB.t60=pbEl('text',txt); PB.t220=pbEl('text',Object.assign({'text-anchor':'middle'},txt));
  PB.t1k=pbEl('text',Object.assign({'text-anchor':'end'},txt));
  PB.t60.textContent='60'; PB.t220.textContent='220'; PB.t1k.textContent='1k';
  PB.ready=true;
}
function drawPitchbar(){
  if(!PB.ready) initPitchbar();
  const w=pbar.clientWidth||340;
  const hh=12;
  const band=f=>((Math.log2(f)-Math.log2(PITCH_MIN))/(Math.log2(PITCH_MAX)-Math.log2(PITCH_MIN)))*w;
  const hist=A.meterHist;
  let d='';
  if(hist.length>1){
    for(let i=0;i<hist.length;i++){
      const v=hist[i];
      let y;
      if(v===null||v===undefined) y=hh-2;
      else if(S.input==='volume') y=hh-2-mclamp((v+60)/60,0,1)*(hh-4);
      else y=hh-2-mclamp((Math.log2(Math.max(20,v)/PITCH_MIN))/(Math.log2(PITCH_MAX/PITCH_MIN)),0,1)*(hh-4);
      const x=(i/(hist.length-1))*w;
      d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);
    }
  }
  PB.hist.setAttribute('d',d);
  PB.track.setAttribute('width',w);
  PB.band.setAttribute('x',band(160));
  PB.band.setAttribute('width',Math.max(0,band(400)-band(160)));
  PB.ref.setAttribute('x1',band(220)); PB.ref.setAttribute('x2',band(220));
  let mx=-1,label='';
  if(S.input==='volume'){
    const db=A.val===null?-60:A.val;
    mx=mclamp((db+60)/60,0,1)*w;
    label=db.toFixed(0)+' dB';
  }else if(A.hz>0){
    mx=mclamp((Math.log2(A.hz)-Math.log2(PITCH_MIN))/(Math.log2(PITCH_MAX)-Math.log2(PITCH_MIN)),0,1)*w;
    label=A.hz.toFixed(1)+' Hz';
  }
  if(mx>=0){
    PB.ptr.setAttribute('opacity','1');
    PB.ptr.setAttribute('transform','translate('+mx.toFixed(1)+',28)');
    PB.knob.setAttribute('fill',A.voiceA?'#ff8b5e':'#a99c8a');
    PB.val.textContent=label;
    PB.val.setAttribute('x',mclamp(mx,26,w-26));
  }else{
    PB.ptr.setAttribute('opacity','0');
    PB.val.textContent='';
  }
  PB.t60.setAttribute('x',2); PB.t60.setAttribute('y',42);
  PB.t220.setAttribute('x',band(220)); PB.t220.setAttribute('y',42);
  PB.t1k.setAttribute('x',w-2); PB.t1k.setAttribute('y',42);
}
/* The in-game instruments (gate counter + tilt gauge) are SVG elements
   pinned to the canvas box, so they stay crisp and are never clipped by the
   canvas edge the way the old canvas-drawn ones were. */
function updateHud(){
  /* No progress bar: an endless run has no end to measure against. The
     headline number is the distance flown, the chip counts the gates. */
  $('distVal').textContent=Math.floor(G.dist);
  $('hudGatesTxt').textContent=G.score;
  const t=mclamp(G.theta,-1,1);
  const fill=$('hudTiltFill');
  const half=58;
  if(t>=0){
    fill.setAttribute('x',72); fill.setAttribute('width',(half*t).toFixed(1));
    fill.setAttribute('fill','#3e7d2c');
  }else{
    fill.setAttribute('x',(72+half*t).toFixed(1)); fill.setAttribute('width',(-half*t).toFixed(1));
    fill.setAttribute('fill','#e2574b');
  }
  $('hudTiltTxt').textContent='θ '+t.toFixed(2);
  /* The gate counter belongs to a running game on a GATE track; the canyon is
     distance-only and the tilt gauge is also useful on the setup screen. */
  const gateVisible=showsGateCount()&&S.screen!=='home'&&S.screen!=='draw';
  $('hudGates').classList.toggle('gHide',!gateVisible);
  $('hud').classList.toggle('gHide',S.screen==='home'||S.screen==='draw');
}
function updateReadout(){
  /* Just the number and its unit. No status captions: the bars and the HUD
     already show whether the mic is live. */
  const big=$('hzBig');
  if(S.input==='volume'){
    const db=A.val===null?null:A.val;
    big.innerHTML=(db===null?'--':db.toFixed(0))+'<span class="unit">dB</span>';
  }else{
    big.innerHTML=(A.hz>0?A.hz.toFixed(1):'--')+'<span class="unit">Hz</span>';
  }
}

/* ============================ home audio tester ============================ */
/* The home page is not just a poster: once the mic is granted the waveform,
   Hz/dB number and status all react to the real signal. A level in [0,1]
   drives the bars; 0 keeps a gentle idle sway so the page still feels alive. */
function homeAudioLevel(){
  if(!A.ready) return 0;
  if(S.input==='volume') return A.val===null?0:mclamp((A.val+60)/60,0,1);
  return mclamp(A.rms*7,0,1);
}
function updateHomeAudio(){
  const wave=$('homeWave'); if(!wave) return;
  const lvl=homeAudioLevel();
  const bars=wave.children||[];
  for(let i=0;i<bars.length;i++){
    const sway=Math.sin(performance.now()/260+i*0.9)*0.5+0.5;
    const h=10+sway*10+lvl*42;
    bars[i].style.height=Math.round(h)+'px';
  }
  wave.classList.toggle('live',lvl>0.02);
  const val=$('homeHzVal');
  if(val){
    if(S.input==='volume') val.textContent=A.val===null?'--':A.val.toFixed(0);
    else val.textContent=A.hz>0?Math.round(A.hz):'--';
    const unit=$('homeHzUnit');
    if(unit) unit.textContent=S.input==='volume'?'dB':'Hz';
  }
  const btn=$('btnMicTest');
  if(btn) btn.classList.toggle('on',A.ready);
}

/* ============================ networking ============================ */
/* The hosted share link is gated by a `sharecode` query parameter: requests
   without it get a 403 from the platform gateway BEFORE they reach our Node
   server. Every same-origin API call must therefore carry the page's query
   string through. Locally there is no query string, so this is a no-op. */
function gateQuery(){
  const s=location.search;
  return (s&&s.length>1)?s:'';
}
async function api(path,body){
  const sentAt=Date.now();
  let res;
  try{
    res=await fetch('/api/room/'+path+gateQuery(),{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body||{})
    });
  }catch(e){
    /* offline, DNS failure, or the request was blocked before it left */
    throw new Error('NETWORK');
  }
  let j=null;
  try{ j=await res.json(); }catch(e){}
  if(!res.ok||!j||!j.ok){
    /* A platform gateway may answer with HTML (403) or a login page (200),
       so there is no JSON error code to read. Keep those distinct from a real
       server error instead of collapsing every failure into "room failed". */
    let code=j&&j.error;
    if(!code){
      if(res.status===403) code='GATEWAY';
      else if(res.status>=500) code='HTTP_'+res.status;
      else code='BAD_REPLY';
    }
    throw new Error(code);
  }
  if(typeof j.now==='number'){
    /* server clock minus our clock, corrected by half the round trip so the
       estimate lands on the moment the server actually stamped the reply */
    const rtt=Date.now()-sentAt;
    NET.clockOffset=j.now+Math.round(rtt/2)-Date.now();
  }
  return j;
}
function errText(code){
  const map={
    ROOM_NOT_FOUND:'roomNotFound',ROOM_FULL:'roomFull',ROOM_CLOSED:'roomClosed',
    NEED_TWO:'needTwo',NOT_READY:'allReady',HOST_ONLY:'needTwo',
    BAD_TOKEN:'roomToken',
    NETWORK:'roomBlocked',GATEWAY:'roomBlocked',
    BAD_REPLY:'roomHttp'
  };
  if(map[code]) return map[code];
  if(/^HTTP_5/.test(code)) return 'roomHttp';
  if(/^HTTP_/.test(code)) return 'roomBlocked';
  return map[code]||'roomFail';
}
/* Host and guest must agree on the exact gate keys, their spacing, the style
   and the loop length; otherwise the two devices sample lineAt() at
   different periods and draw different obstacles. */
function syncRoomLevel(level){
  UI.customLine=Array.isArray(level.customLine)&&level.customLine.length>=4
    ? level.customLine.slice() : null;
  UI.customStyle=level.customStyle==='spikes'?'spikes':'pipes';
  UI.customGap=UI.customLine
    ? mclamp(Number(level.keyGap)||CFG.gapX[S.diff]||CFG.gapX.normal,40,600) : 0;
  UI.customLoopLen=mclamp(Number(level.loopLen)||CFG.loopLen,CFG.W,CFG.drawMaxLen);
  G.loopLen=UI.customLine?UI.customLine.length*UI.customGap:0;
  updateDrawStyleBtn();
  /* The studio must open on the style that is actually being flown. */
  UI.drawPreviewStyle=UI.customStyle;
}
async function roomCreate(){
  if(S.track==='custom'&&!UI.customLine){ toast('needDraw','bad'); return; }
  const src=S.input==='volume'?'volume':'pitch';
  try{
    const j=await api('create',{
      diff:S.diff, source:src,
      level:{
        seed:(Date.now()>>>0)||1,
        customLine:S.track==='custom'?UI.customLine:null,
        keyGap:S.track==='custom'?UI.customGap:0,
        track:S.track,
        customStyle:S.track==='custom'?UI.customStyle:'pipes',
        loopLen:S.track==='custom'?UI.customLoopLen:CFG.loopLen
      }
    });
    NET.code=j.code;NET.token=j.token;NET.role='A';NET.room=j.room;
    NET.myReady=false;NET.phase='lobby';NET.online=true;
    S.mode='duo'; S.input=j.room.source==='volume'?'volume':'pitch';
    G.seed=j.room.level.seed;
    syncRoomLevel(j.room.level);
    syncSeg('segSrc',S.input);
    syncSeg('segRoomSrc',S.input);
    startNetLoop();
    setScreen('room');
    updateRoomUI();
    toast('roomWait');
  }catch(e){ toast(errText(e.message),'bad'); }
}
async function roomJoin(code){
  code=String(code||'').trim().toUpperCase();
  if(code.length!==6){ toast('roomNotFound','bad'); return; }
  try{
    const j=await api('join',{code});
    NET.code=j.code;NET.token=j.token;NET.role='B';NET.room=j.room;
    NET.myReady=false;NET.phase='lobby';NET.online=true;
    S.mode='duo'; S.input=j.room.source==='volume'?'volume':'pitch';
    G.seed=j.room.level.seed;
    syncRoomLevel(j.room.level);
    S.track=j.room.level.customLine?'custom':(j.room.level.track||'random');
    S.diff=j.room.diff;
    syncSeg('segTrack',S.track);
    syncSeg('segRoomTrack',S.track);
    syncSeg('segDiff2',S.diff);
    syncSeg('segRoomDiff',S.diff);
    syncSeg('segSrc',S.input);
    syncSeg('segRoomSrc',S.input);
    startNetLoop();
    setScreen('room');
    updateRoomUI();
  }catch(e){ toast(errText(e.message),'bad'); }
}
async function roomReady(v){
  try{
    const j=await api('ready',{code:NET.code,token:NET.token,ready:v});
    NET.room=j.room; NET.myReady=v;
    updateRoomUI();
  }catch(e){ toast(errText(e.message),'bad'); }
}
async function roomStart(){
  try{
    const j=await api('start',{code:NET.code,token:NET.token});
    NET.room=j.room; NET.phase='play';
    NET.startAt=j.room.startAt; NET.startedAt=j.room.startAt;
    beginDuo(j.room);
  }catch(e){ toast(errText(e.message),'bad'); }
}
async function roomLeave(){
  try{ await api('leave',{code:NET.code,token:NET.token}); }catch(e){}
  NET.code=null;NET.token=null;NET.role=null;NET.room=null;NET.phase='lobby';
  NET.rx=null;NET.remoteA=0;NET.remoteB=0;NET.hintUntil=0;
  S.mode='solo';
  stopNetLoop();
  setScreen('home');
}
/* The host ends the run for BOTH players: /stop flips the server phase back
   to lobby and every client's poll follows it (exitDuo). */
async function stopDuo(){
  try{
    const j=await api('stop',{code:NET.code,token:NET.token});
    NET.room=j.room;
  }catch(e){ toast(errText(e.message),'bad'); return; }
  NET.phase='lobby';
  exitDuo();
}
function beginDuo(room){
  S.mode='duo';
  G.seed=room.level.seed;
  syncRoomLevel(room.level);
  S.input=room.source==='volume'?'volume':'pitch';
  S.track=room.level.customLine?'custom':(room.level.track||'random');
  S.diff=room.diff;
  syncSeg('segTrack',S.track);
  syncSeg('segRoomTrack',S.track);
  syncSeg('segDiff2',S.diff);
  syncSeg('segRoomDiff',S.diff);
  syncSeg('segSrc',S.input);
  syncSeg('segRoomSrc',S.input);
  resetGame();
  S.play='playing';
  G.calibT=0;
  UI.paused=false;
  NET.rx=null;
  NET.hintUntil=performance.now()+5200;
  $('ovEnd').classList.remove('show');
  /* Dedicated game screen: the room card must NOT stay on top of a running
     duo game (that was the old "guest still sits in the lobby" bug). */
  setScreen('duo');
}
/* Authoritative follow: the server phase is the source of truth for BOTH
   roles. Back to 'lobby' (the host tapped 回到房间) returns every client to
   the room screen without a tap. */
function exitDuo(){
  S.play='idle';
  UI.paused=false;
  NET.startAt=0; NET.startedAt=0; NET.rx=null;
  NET.remoteA=0; NET.remoteB=0; NET.hintUntil=0;
  $('ovEnd').classList.remove('show'); $('ovPause').classList.remove('show');
  buildAttract();
  setScreen('room');
  updateRoomUI();
}
function updateRoomUI(){
  /* The room footer has two layers: the entry sheet (track + difficulty +
     create/join) before a room exists, and the live room card afterwards. */
  const entry=$('roomEntry'), active=$('roomActive');
  if(entry&&active){
    const inRoom=!!NET.code&&!!NET.room;
    entry.classList.toggle('show',!inRoom);
    active.classList.toggle('show',inRoom);
  }
  const r=NET.room; if(!r) return;
  $('roomCode').textContent=NET.code||'------';
  $('pillRole').textContent=NET.role==='A'?tr('roomHost'):tr('roomGuest');
  const src=r.source==='volume'?'volume':'pitch';
  $('pillSrc').textContent=tr('lblCtrl')+' · '+tr(src);
  /* Control briefing: the one place both players read the rules before a
     run starts (source-aware: pitch or volume). */
  const brief=tr(src==='volume'?'duoBriefVolume':'duoBriefPitch');
  const rb=$('roomBrief');
  if(rb&&rb.textContent!==brief) rb.textContent=brief;
  const a=r.members.A,b=r.members.B;
  $('pillA').textContent='A · '+(a.joined?(a.ready?tr('isReady'):tr('joined')):tr('notJoined'));
  $('pillB').textContent='B · '+(b.joined?(b.ready?tr('isReady'):tr('joined')):tr('notJoined'));
  $('pillA').className='pill'+(a.ready?' on':'');
  $('pillB').className='pill'+(b.ready?' on':'');
  /* Keep the platform `sharecode` (and anything else already in the URL);
     otherwise the second player's invite link would be rejected with 403. */
  const share=new URL(location.href);
  share.searchParams.set('room',NET.code||'');
  $('shareUrl').textContent=share.toString();
  const host=NET.role==='A';
  $('btnRoomStart').style.display=host?'':'none';
  $('btnReady').style.display=host?'none':'';
  $('btnReadyTxt').textContent=NET.myReady?tr('notReady'):tr('ready');
  /* the host can only start once BOTH players are ready */
  $('btnRoomStart').disabled=host ? !(a.ready&&b.ready) : false;
  if(host){
    $('roomHint').innerHTML=(b.joined?'':(tr('roomWait')+'<br>'))+
      (a.ready&&b.ready?('<span class="ok">'+tr('canStart')+'</span>'):tr('hintRoom'));
  }else{
    $('roomHint').innerHTML=(NET.myReady?tr('isReady'):tr('hintRoom'))+
      (a.ready?' <span class="ok">'+tr('allReady')+'</span>':'');
  }
}
let netTimer=0;
function startNetLoop(){
  stopNetLoop();
  /* 20 Hz is plenty: the host is authoritative locally, the guest
     interpolates, and a 33ms interval queued overlapping fetches on a phone
     network. */
  netTimer=setInterval(netTick,50);
}
function stopNetLoop(){ if(netTimer){ clearInterval(netTimer); netTimer=0; } }
function netTick(){
  if(!NET.code||!NET.token) return Promise.resolve();
  /* Never stack requests: on a slow connection the old 33ms timer fired again
     before the previous round-trip finished, hammering the gateway. */
  if(NET.busy) return Promise.resolve();
  NET.busy=true;
  const body={
    code:NET.code,token:NET.token,role:NET.role,
    /* Player B posts the NEGATED value: a higher/louder guest voice must
       arrive as a negative ctrl so the host's upA-downB formula (ctrlTarget)
       reads it as downward push. */
    ctrl:{v:NET.role==='B'?-localCtrl():localCtrl(),hz:A.hz}
  };
  if(NET.role==='A'){
    body.state={x:G.x,y:G.y,theta:G.theta,vy:G.vy,score:G.score,
      alive:S.play!=='over',dist:G.dist,paused:UI.paused};
  }
  return api('sync',body).then(j=>{
    NET.room=j.room; NET.online=true;
    NET.remoteA=j.room.ctrl.A?j.room.ctrl.A.v:0;
    NET.remoteB=j.room.ctrl.B?j.room.ctrl.B.v:0;
    if(NET.role==='B'&&j.room.state){
      NET.rx=j.room.state;
    }
    const ph=j.room.phase;
    if(ph==='closed'){ toast('roomClosed','bad'); roomLeave(); return; }
    if(ph==='play'&&j.room.startAt&&j.room.startAt!==NET.startedAt){
      /* Authoritative follow: a (re)start on the server pulls BOTH clients
         into the game - the guest never has to tap anything. */
      NET.startedAt=j.room.startAt; NET.startAt=j.room.startAt; NET.phase='play';
      beginDuo(j.room);
    }else if(ph==='lobby'&&NET.phase==='play'){
      /* The host ended the run for everyone. */
      NET.phase='lobby';
      exitDuo();
    }else if(NET.phase==='play'&&ph==='play'){
      /* Partner vanished mid-run: drop back to the room with a message. */
      const peerIn=NET.role==='A'?j.room.members.B.joined:j.room.members.A.joined;
      if(!peerIn){ toast('peerLeft','bad'); NET.phase='lobby'; exitDuo(); }
    }
    updateRoomUI();
  }).catch(()=>{
    if(NET.online){ NET.online=false; toast('offline','bad'); }
  }).finally(()=>{ NET.busy=false; });
}
function localCtrl(){
  /* Pitch slide is in semitones and volume deviation is in dB, so the
     conversion has to use the span of the source the room actually chose. */
  const span=CFG.span[S.input]||CFG.span.pitch;
  return mclamp(S.gain*A.slide/span,-1,1);
}

/* ============================ segmented controls ============================ */
function syncSeg(id,v){
  const el=$(id); if(!el) return;
  for(const b of el.querySelectorAll('button')) b.classList.toggle('on',b.dataset.v===v);
}
function bindSeg(id,fn){
  const el=$(id); if(!el) return;
  el.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b||!b.dataset.v) return;
    syncSeg(id,b.dataset.v);
    fn(b.dataset.v);
  });
}

/* ============================ layout ============================ */
function layout(){
  const stage=$('stage');
  /* #app already applies the notch safe-area padding; this extra inset keeps
     the canvas and its HUD off the screen edges on every device. */
  const M=12;
  const cw=Math.max(0,stage.clientWidth-M*2), ch=stage.clientHeight;
  if(cw<2||ch<2) return;
  const scale=Math.min(cw/LOG.W,ch/VIEWH);
  const w=Math.max(80,Math.round(LOG.W*scale)), h=Math.max(120,Math.round(VIEWH*scale));
  game.style.width=w+'px'; game.style.height=h+'px';
  game.style.left=(M+Math.round((cw-w)/2))+'px';
  game.style.top=Math.round((ch-h)/2)+'px';
  /* The HUD is an SVG overlay pinned to the canvas box, so it scales with the
     canvas and never spills outside the playable area. */
  const hud=$('hud');
  if(hud){
    hud.style.width=w+'px'; hud.style.height=h+'px';
    hud.style.left=game.style.left; hud.style.top=game.style.top;
  }
  const dpr=Math.min(3,window.devicePixelRatio||1);
  game.width=Math.round(w*dpr); game.height=Math.round(h*dpr);
  /* The world is shifted so the visible window sits at the canvas top. */
  gx.setTransform(dpr*scale,0,0,dpr*scale,0,-dpr*scale*VIEWY0);
  /* the pitch meter is SVG now: it scales with CSS, no bitmap to resize */
}

/* ============================ main loop ============================ */
let lastTs=0, acc=0;
function loop(ts){
  requestAnimationFrame(loop);
  const now=ts/1000;
  const dt=lastTs?Math.min(0.1,now-lastTs):0;
  lastTs=now;
  sampleAudio(dt);
  if(S.screen==='draw'){
    drawEdgeScroll(dt);
    if(UI.dirty){ UI.dirty=false; refreshBothLines(); }
  }
  const isHost=!(S.mode==='duo'&&NET.role==='B');
  if(S.play==='idle'&&S.screen==='home'&&S.mode==='solo'){
    /* attract mode: the world drifts by so the home screen is alive */
    G.x+=CFG.vx*0.5*dt; G.camX=G.x-CFG.birdX;
    const w=Math.sin(G.x/150);
    G.y+=(VIEWY0+VIEWH/2+w*95-G.y)*Math.min(1,dt*1.6);
    G.theta+=(w*0.34-G.theta)*Math.min(1,dt*2.4);
    G.vy=0; G.vFall=0;
  }else if((S.play==='playing'||S.play==='calib')&&isHost&&!UI.paused){
    if(S.mode==='duo'&&NET.startAt){
      /* wall-clock driven so host and guest stay in lock-step */
      const want=Math.max(0,Math.floor((serverNow()-NET.startAt)/1000*MFPS));
      let n=0;
      while(G.stepCount<want&&n<10){ step(MDT); G.stepCount++; n++; }
      if(G.stepCount>=want) acc=0;
    }else{
      acc+=dt; let n=0;
      while(acc>=MDT&&n<5){ step(MDT); acc-=MDT; n++; }
    }
  }else acc=0;
  if(!isHost) applyRemoteState(dt);
  drawFrame();
  drawPitchbar();
  updateHud();
  updateReadout();
  updateHomeAudio();
}
function applyRemoteState(dt){
  const rx=NET.rx; if(!rx) return;
  G.x=rx.x; G.camX=G.x-CFG.birdX;
  G.y+=(rx.y-G.y)*Math.min(1,dt*14);
  G.theta+=(rx.theta-G.theta)*Math.min(1,dt*14);
  G.vy=rx.vy; G.score=rx.score; G.dist=rx.dist;
  if(rx.alive===false&&S.play!=='over'){
    S.play='over'; G.over=true;
    $('endTitle').textContent=tr('crashed'); $('endTitle').style.color='#e2574b';
    $('endSub').textContent=renderEndSub();
    updateEndArt();
    syncOverUI();
    $('ovEnd').classList.add('show');
  }
}

/* ============================ boot ============================ */
function boot(){
  layout();
  window.addEventListener('resize',()=>layout());
  window.addEventListener('orientationchange',()=>setTimeout(layout,220));
  /* A saved hand-drawn track is restored before the first frame, so a reload
     neither loses it nor forgets that it was the selected track. */
  if(loadStroke()&&UI.savedTrack==='custom'){
    S.track='custom';
    syncSeg('segTrack','custom');
    refreshBothLines();
    updateDrawStyleBtn();
  }
  /* The pen button always carries the live style label, saved stroke or not. */
  updateDrawStyleBtn();

  /* The corridor - and therefore the drop two neighbouring gates may have -
     depends on the difficulty. A stroke drawn on Easy is far too steep for
     Hard, where the very same stroke leaves an opening narrower than the
     bird (or none at all), so the strip is re-fitted whenever the difficulty
     changes. */
  const applyDiff=v=>{
    S.diff=v;
    syncSeg('segDiff2',v); syncSeg('segRoomDiff',v);
    /* Re-fit the saved stroke for the new difficulty: the gate spacing (and
       with it the opening between two neighbouring gates) is derived from
       CFG.gapX[diff], so this is the "auto adjust the spacing" step. In a live
       room the level belongs to the server, so it is left untouched here. */
    if(!(S.mode==='duo'&&NET.online)){
      refreshBothLines();
      updateDrawChrome();
      if(S.screen==='draw') drawFrame();
    }
    if(S.screen==='home') buildAttract();
  };
  bindSeg('segDiff2',applyDiff);
  bindSeg('segRoomDiff',applyDiff);
  bindSeg('segTrack',v=>{
    if(v==='custom'){ startDraw(); return; }
    S.track=v; syncSeg('segTrack',v);
  /* The pen button carries the style, so it has to be re-labelled too. */
  syncTrackStyleLabel();
    if(S.screen==='draw') setScreen('solo');
    updateDrawChrome();
  });
  bindSeg('segRoomTrack',v=>{ S.track=v; syncSeg('segRoomTrack',v); });
  bindSeg('segSrc',v=>{ S.input=v; syncSeg('segRoomSrc',v); refreshHints(); });
  bindSeg('segRoomSrc',v=>{ S.input=v; syncSeg('segSrc',v); refreshHints(); });

  $('btnSolo').addEventListener('click',async()=>{
    S.mode='solo';
    setScreen('solo');
    if(!A.ready) await enableMic();
  });
  /* "Two players" opens the room ENTRY sheet first: track + difficulty are
     chosen before a room is ever created, matching the solo flow. While
     DUO_ENABLED is false the entry only shows the devSoon toast. */
  $('btnRoom').addEventListener('click',async()=>{
    if(!DUO_ENABLED){ toast('devSoon','bad'); return; }
    S.mode='duo';
    setScreen('room');
    if(!A.ready) await enableMic();
  });
  $('btnCreateNow').addEventListener('click',async()=>{
    if(!A.ready) await enableMic();
    await roomCreate();
  });
  $('btnBack').addEventListener('click',()=>{
    /* Inside a room the back button is a real leave: the partner must see it. */
    if(S.mode==='duo'&&NET.code){ roomLeave(); return; }
    S.play='idle'; S.mode='solo'; UI.paused=false;
    $('ovEnd').classList.remove('show'); $('ovPause').classList.remove('show');
    buildAttract();
    setScreen('home');
  });
  $('btnMicTest').addEventListener('click',async()=>{
    if(!A.ready) await enableMic();
    if(A.ready) toast('micOn','good');
  });
  $('btnShowJoin').addEventListener('click',()=>{
    const r=$('joinRow');
    r.style.display=r.style.display==='none'?'flex':'none';
  });
  $('btnJoin').addEventListener('click',async()=>{
    if(!A.ready) await enableMic();
    await roomJoin($('joinCode').value);
  });
  $('joinCode').addEventListener('keydown',e=>{ if(e.key==='Enter') $('btnJoin').click(); });
  $('btnReady').addEventListener('click',()=>roomReady(!NET.myReady));
  $('btnRoomStart').addEventListener('click',()=>roomStart());
  $('btnLeave').addEventListener('click',()=>roomLeave());
  $('btnCopy').addEventListener('click',async()=>{
    const url=$('shareUrl').textContent;
    try{
      if(navigator.clipboard&&window.isSecureContext) await navigator.clipboard.writeText(url);
      else{
        const ta=document.createElement('textarea');
        ta.value=url; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
      }
      toast('copied','good');
    }catch(e){ toast('copyFail','bad'); }
  });

  $('btnMain').addEventListener('click',async()=>{
    if(S.screen==='solo'&&(S.play==='playing'||S.play==='calib')){
      UI.paused=true; S.play='paused';
      $('ovPause').classList.add('show');
      syncPlayUI();
      return;
    }
    if(S.play==='paused'){ resumeGame(); return; }
    if(S.screen==='solo'){ if(!A.ready) await enableMic(); startGame(); }
  });
  $('btnResume').addEventListener('click',resumeGame);
  $('btnRestart').addEventListener('click',()=>{ UI.paused=false; $('ovPause').classList.remove('show'); startGame(); });
  $('btnAgain').addEventListener('click',()=>{
    UI.paused=false;
    if(S.mode==='duo'){
      /* Host-driven end of run: one tap sends BOTH players back to the room
         (the guest follows the lobby phase in netTick). */
      if(NET.role==='A') stopDuo();
      return;
    }
    startGame();
  });
  $('btnHome').addEventListener('click',()=>{
    /* Leaving from a live room must also tell the server, or the partner
       would keep polling a room nobody is in. */
    if(S.mode==='duo'&&NET.code){ roomLeave(); return; }
    S.play='idle'; S.mode='solo'; UI.paused=false;
    $('ovEnd').classList.remove('show'); $('ovPause').classList.remove('show');
    buildAttract();
    setScreen('home');
  });
  $('btnMicRetry').addEventListener('click',async()=>{ UI.micLater=false; await enableMic(); });
  $('btnMicLater').addEventListener('click',()=>{ UI.micLater=true; setScreen(S.screen); });
  $('btnLang').addEventListener('click',()=>{
    LANG=LANG==='zh'?'en':'zh';
    document.documentElement.lang=LANG==='zh'?'zh-CN':'en';
    applyI18n();
    setScreen(S.screen);
  });

  $('btnUndo').addEventListener('click',()=>{
    /* One-level undo: restore the stroke exactly as it was before the last
       gesture began. Without a snapshot there is nothing to go back to, and
       undoing mid-draw would fight the live pointer. */
    if(!UI.drawUndo||UI.drawing) return;
    UI.drawPts=UI.drawUndo;
    UI.drawUndo=null;
    UI.smoothedUpTo=UI.drawPts.length;
    UI.freshFrom=null;
    refreshBothLines();
    saveStroke();
    updateDrawChrome();
    drawFrame();
  });
  $('btnClear').addEventListener('click',()=>{
    /* The only way to throw a saved track away: clear the memory copy AND the
       stored one, otherwise 清空 would come back on the next visit. */
    UI.drawPts=[]; UI.smoothedUpTo=0; clearStroke(); refreshBothLines(); updateDrawChrome(); drawFrame();
  });
  /* Toggling reads the CHOSEN style, not the alias: the alias is only kept
     for compatibility and can never be the source of truth. */
  $('btnDrawStyle').addEventListener('click',()=>setDrawStyle(UI.customStyle==='spikes'?'pipes':'spikes'));
  $('btnExtend').addEventListener('click',()=>{
    extendDraw(UI.drawLen+LOG.W);
    UI.drawScroll=drawViewportMax(); updateDrawChrome(); drawFrame();
  });
  $('btnDrawPrev').addEventListener('click',()=>scrollDraw(-LOG.W));
  $('btnDrawNext').addEventListener('click',()=>scrollDraw(LOG.W));
  $('drawSeek').addEventListener('input',e=>{
    UI.drawScroll=mclamp(Number(e.target.value)||0,0,drawViewportMax());
    updateDrawChrome(); drawFrame();
  });
  $('btnRand').addEventListener('click',()=>{
    randomDrawLine();
    toast('randDone','good');
  });
  $('btnDone').addEventListener('click',finishDraw);
  game.addEventListener('pointerdown',onPointerDown);
  game.addEventListener('pointermove',onPointerMove);
  game.addEventListener('pointerup',onPointerUp);
  game.addEventListener('pointercancel',onPointerUp);

  applyI18n();
  buildAttract();
  setScreen('home');

  const q=new URLSearchParams(location.search);
  const rc=(q.get('room')||'').trim().toUpperCase();
  if(rc.length===6){
    /* Invite link: prefill the code, reveal the join row, and join straight
       away. If joining fails the entry sheet is already in a usable state.
       While DUO_ENABLED is false a stale link must not create a session:
       it just shows the devSoon toast and stays on home. */
    if(DUO_ENABLED){
      const jc=$('joinCode'); if(jc) jc.value=rc;
      const jr=$('joinRow'); if(jr) jr.style.display='flex';
      S.mode='duo';
      setScreen('room');
      /* The mic MUST come up for an invite-link guest too, otherwise the guest
         sits in the room publishing a constant zero. */
      roomJoin(rc).then(()=>{ if(NET.code&&!A.ready) enableMic(); });
    }else{
      toast('devSoon','bad');
    }
  }

  requestAnimationFrame(loop);
}
function resumeGame(){
  UI.paused=false; $('ovPause').classList.remove('show');
  S.play='playing';
  syncPlayUI();
}
function applyI18n(){
  for(const el of document.querySelectorAll('[data-i18n]')){
    const v=tr(el.dataset.i18n);
    /* A button may carry an SVG icon next to its label. Writing textContent
       on the button itself would delete the glyph, so the label span is
       updated instead when one exists. */
    if(el.tagName==='BUTTON'&&el.classList.contains('btn')){
      const span=el.querySelector('span');
      if(span) span.textContent=v; else el.textContent=v;
    }
    else if(el.namespaceURI==='http://www.w3.org/2000/svg') el.textContent=v;
    else el.innerHTML=v;
  }
  for(const el of document.querySelectorAll('[data-i18n-ph]')) el.placeholder=tr(el.dataset.i18nPh);
  $('distLbl').textContent=tr('dist');
  $('langTxt').textContent=LANG==='zh'?'EN':'中';
  /* the main button label is derived from the run state, so it must be
     recomputed after a language switch */
  syncMainBtn();
  /* these two are written outside the i18n pass, so refresh them explicitly */
  $('micLabel').textContent=A.micState==='on'?tr('micOn')
    : A.micState==='blocked'?tr('micBlocked'):tr('micHint');
  if(S.play!=='over') $('endTitle').textContent=tr('crashed');
  /* result overlay text is generated at runtime, not via data-i18n */
  if(G.over){
    $('endTitle').textContent=tr('crashed');
    $('endTitle').style.color='#e2574b';
    $('endSub').textContent=renderEndSub();
    updateEndArt();
  }
  updateReadout();
  refreshHints();
  /* The over overlay's action depends on the role, not on a data-i18n key. */
  syncOverUI();
  /* The pen button label is built from the style, not from a data-i18n key,
     so it has to be rebuilt after a language switch. */
  syncTrackStyleLabel();
  if(UI_T.key) renderToast();
}
boot();
</script>
